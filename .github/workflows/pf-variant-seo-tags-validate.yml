name: pf-variant-seo-tags-validate

on:
  push:
    branches:
      - feat/pf-variant-seo-tags-orbit-governance
    paths:
      - .github/workflows/pf-variant-seo-tags-validate.yml
      - services/api/test/perfect_fit_variant_seo_tags.test.mjs

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pf-variant-seo-tags-orbit-governance
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/samara-web/my-vite-react-app/package-lock.json
      - name: Install root workspace
        run: npm ci --ignore-scripts
      - name: Syntax check server integration
        run: |
          node --check services/api/src/services/perfectFit/workspaceProductProjection.js
          node --check services/api/src/services/perfectFit/productGateway.js
      - name: Run Perfect Fit governance tests
        run: |
          node --test services/api/test/perfect_fit_variant_seo_tags.test.mjs services/api/test/perfect_fit_governed_garment_taxonomy.test.mjs services/api/test/perfect_fit_metadata_manifest.test.mjs services/api/test/perfect_fit_workspace_engine_projection.test.mjs
      - name: Install Samara app
        run: npm ci --prefix apps/samara-web/my-vite-react-app --ignore-scripts
      - name: Build Samara / Perfect Fit
        run: npm --prefix apps/samara-web/my-vite-react-app run build
