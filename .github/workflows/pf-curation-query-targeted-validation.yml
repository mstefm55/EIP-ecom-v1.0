name: PF curation query targeted validation

on:
  push:
    branches:
      - fix/pf-curation-query-refresh
    paths:
      - .github/workflows/pf-curation-query-targeted-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pf-curation-query-refresh
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/samara-web/my-vite-react-app/package-lock.json

      - name: Install root workspace
        run: npm ci --ignore-scripts

      - name: Run PF curation regression test
        run: node --test services/api/test/perfect_fit_admin_curation_ownership.test.mjs

      - name: Install Perfect Fit frontend
        working-directory: apps/samara-web/my-vite-react-app
        run: npm ci --ignore-scripts

      - name: Build Perfect Fit frontend
        working-directory: apps/samara-web/my-vite-react-app
        run: npm run build

      - name: Remove one-use workflow
        run: |
          rm .github/workflows/pf-curation-query-targeted-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pf-curation-query-targeted-validation.yml
          git commit -m "Remove one-use PF curation query validation workflow"
          git push origin HEAD:fix/pf-curation-query-refresh
