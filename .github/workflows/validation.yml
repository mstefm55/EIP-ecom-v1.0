name: validation

on:
  push:
    branches: [ "master", "main" ]
  pull_request:

jobs:
  process-alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate process alignment
        run: node tools/validate_process_alignment.mjs
