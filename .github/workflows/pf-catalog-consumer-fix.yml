name: Apply PF catalogue consumer completion

on:
  push:
    branches:
      - fix/pf-merchandising-consumer-completion
    paths:
      - .github/workflows/pf-catalog-consumer-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pf-merchandising-consumer-completion
          fetch-depth: 0

      - name: Patch catalogue and homepage consumers
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/samara-web/my-vite-react-app/src/App.jsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
            (
              "import { selectPatternsForSurface, slugifyCatalogValue } from './data/catalogTaxonomy';",
              "import { matchesPatternCatalogFilters, selectPatternsForSurface, slugifyCatalogValue } from './data/catalogTaxonomy';"
            ),
            (
              "patterns={productPresentationPatterns.slice(0, 10)}",
              "patterns={selectPatternsForSurface(productPresentationPatterns, 'signature-orbit-carousel', 10)}"
            ),
            (
              "const patternCategory = slugifyCatalogValue(p.mainCategory || p.category || 'dresses');\nconst patternDesigner = p.designerBrand || 'Perfect Fit Bureau';",
              "const patternDesigner = p.designerBrand || 'Perfect Fit Bureau';"
            ),
            (
              "const matchesCatalogCategory =\n  selectedCatalogCategories.length === 0 ||\n  selectedCatalogCategories.includes(patternCategory);",
              "const matchesCatalogCategory =\n  matchesPatternCatalogFilters(p, selectedCatalogCategories);"
            )
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'App.jsx: expected exactly one occurrence, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/pf-catalog-consumer-fix.yml').unlink()

      - name: Commit applied fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete PF catalogue and homepage tag consumers"
          git push origin HEAD:fix/pf-merchandising-consumer-completion
