name: pf-publication-inline-controls-patch

on:
  push:
    branches:
      - feat/pf-publication-inline-approval-curation
    paths:
      - tools/patch_pf_publication_inline_controls.py
      - .github/workflows/pf-publication-inline-controls-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pf-publication-inline-approval-curation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python tools/patch_pf_publication_inline_controls.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/samara-web/my-vite-react-app/src/components/AdminControlPanel.jsx \
                  apps/samara-web/my-vite-react-app/src/App.jsx \
                  services/api/src/routes/public_perfect_fit_admin.js
          git commit -m "Add inline PF moderation approval and curation"
          git push origin HEAD:feat/pf-publication-inline-approval-curation
