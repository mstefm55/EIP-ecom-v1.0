name: pf-keywords-curation-patch

on:
  push:
    branches:
      - feat/pf-keywords-curation-separation
    paths:
      - tools/patch_pf_keywords_curation.py
      - .github/workflows/pf-keywords-curation-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pf-keywords-curation-separation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/patch_pf_keywords_curation.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/samara-web/my-vite-react-app/src/components/Workspace.jsx \
                  apps/samara-web/my-vite-react-app/src/components/PatternSEO.jsx \
                  apps/samara-web/my-vite-react-app/src/lib/workspaceProductPresentation.js \
                  services/api/src/services/perfectFit/productGateway.js \
                  services/api/src/services/perfectFit/workspaceProductProjection.js
          git diff --cached --quiet && exit 0
          git commit -m "Separate PF free keywords from governed curation"
          git push origin HEAD:feat/pf-keywords-curation-separation
