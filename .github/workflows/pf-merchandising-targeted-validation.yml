name: PF merchandising targeted validation

on:
  push:
    branches:
      - fix/pf-merchandising-consumer-completion
    paths:
      - .github/workflows/pf-merchandising-targeted-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pf-merchandising-consumer-completion
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/samara-web/my-vite-react-app/package-lock.json

      - name: Install root workspace
        run: npm ci --ignore-scripts

      - name: Run PF merchandising and publication regression tests
        run: >-
          node --test
          services/api/test/perfect_fit_merchandising_surface_consumers.test.mjs
          services/api/test/perfect_fit_variant_seo_tags.test.mjs
          services/api/test/perfect_fit_publication_moderation_controls.test.mjs

      - name: Install Perfect Fit frontend
        working-directory: apps/samara-web/my-vite-react-app
        run: npm ci --ignore-scripts

      - name: Build Perfect Fit frontend
        working-directory: apps/samara-web/my-vite-react-app
        run: npm run build

      - name: Remove one-use workflow
        run: |
          rm .github/workflows/pf-merchandising-targeted-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pf-merchandising-targeted-validation.yml
          git commit -m "Remove one-use PF merchandising validation workflow"
          git push origin HEAD:fix/pf-merchandising-consumer-completion
